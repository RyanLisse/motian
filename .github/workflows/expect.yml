name: Expect CI

on:
  pull_request:

env:
  PNPM_VERSION: "9.15.0"
  NODE_VERSION: "22.x"

permissions: {}

jobs:
  expect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      # Authenticate the Claude Code CLI via the OAuth token exclusively.
      # Setting ANTHROPIC_API_KEY alongside it causes the ACP provider to
      # take the API-key path and surface AcpProviderUnauthenticatedError
      # because the runner has no interactive `claude login` session.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit firefox

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Resolve Vercel preview URL
        id: vercel_preview
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            for (let attempt = 1; attempt <= 20; attempt += 1) {
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner,
                repo,
                sha,
                per_page: 20,
              });

              for (const deployment of deployments) {
                const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                  owner,
                  repo,
                  deployment_id: deployment.id,
                  per_page: 20,
                });

                const previewStatus = statuses.find((status) =>
                  status.state === "success" &&
                  status.environment === "Preview" &&
                  status.target_url,
                );

                if (previewStatus) {
                  core.setOutput("url", previewStatus.target_url);
                  return;
                }
              }

              if (attempt < 20) {
                await new Promise((resolve) => setTimeout(resolve, 15000));
              }
            }

            throw new Error(`No successful Preview deployment_status target_url found for ${sha}`);

      - name: Run Expect CI
        env:
          VERCEL_URL: ${{ steps.vercel_preview.outputs.url }}
        run: pnpm test:expect:ci
