name: CE Review (Symphony)

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions: {}

jobs:
  ce-review:
    name: CE Code Review
    # Only run on Symphony PRs (label OR branch prefix)
    if: >-
      contains(github.event.pull_request.labels.*.name, 'symphony') ||
      startsWith(github.head_ref, 'symphony/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    # Don't block merge if review fails
    continue-on-error: true
    # One review per PR at a time
    concurrency:
      group: ce-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run CE Review
        id: ce-review
        uses: anthropics/claude-code-action@220272d38887a1caed373da96a9ffdb0919c26cc # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this Symphony-generated PR for the Motian recruitment platform.

            Focus areas:
            1. Correctness — logic errors, edge cases, state management bugs
            2. Project conventions — Dutch API URLs, soft-delete pattern, Zod validation at boundaries
            3. Security — no hardcoded secrets, no XSS/injection, proper auth checks
            4. AI SDK usage — all AI calls through src/lib/ai-models.ts, never raw @ai-sdk/*
            5. Test coverage — new code paths should have corresponding tests

            Post findings as review comments with confidence levels.
            Mark issues as blocking only if they are correctness or security problems.

      - name: Report CE review outcome
        if: always()
        run: |
          echo "CE review outcome: ${{ steps.ce-review.outcome }}"
          echo "CE review conclusion: ${{ steps.ce-review.conclusion }}"

          {
            echo "## CE Code Review (Symphony)"
            echo
            echo "- outcome: \`${{ steps.ce-review.outcome }}\`"
            echo "- conclusion: \`${{ steps.ce-review.conclusion }}\`"
            echo "- PR: #${{ github.event.pull_request.number }}"
            echo "- workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.ce-review.outcome }}" != "success" ]; then
            echo "::warning title=CE Code Review degraded::anthropics/claude-code-action failed upstream without blocking PR CI. See the CE review step logs and job summary for details."
          fi
