name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

env:
  PNPM_VERSION: "9.15.0"
  NODE_VERSION: "22"

jobs:
  # ────────────────────────────────────────────────────────────
  # Job 1: Risk Policy Gate
  # Classifies changed files and emits a risk tier so downstream
  # jobs can gate on it.
  # ────────────────────────────────────────────────────────────
  risk-policy-gate:
    name: Risk Policy Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      risk-tier: ${{ steps.gate.outputs.risk-tier }}
      gate-json: ${{ steps.gate.outputs.gate-json }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore pnpm store cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute changed files
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            CHANGED=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          else
            CHANGED=$(git diff --name-only HEAD~1)
          fi
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Run risk policy gate
        id: gate
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          echo "$CHANGED_FILES" \
            | pnpm tsx scripts/harness/risk-policy-gate.ts --json \
            | tee /tmp/gate-output.json
          TIER=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/gate-output.json','utf8')).tier)")
          echo "risk-tier=$TIER" >> "$GITHUB_OUTPUT"
          echo "Risk tier: $TIER"

          # Persist full JSON for the comment job
          GATE_JSON=$(cat /tmp/gate-output.json)
          echo "gate-json<<GATEJSONEOF" >> "$GITHUB_OUTPUT"
          echo "$GATE_JSON" >> "$GITHUB_OUTPUT"
          echo "GATEJSONEOF" >> "$GITHUB_OUTPUT"

      - name: Annotate step summary
        if: always()
        env:
          RISK_TIER: ${{ steps.gate.outputs.risk-tier }}
        run: |
          GATE_JSON='${{ steps.gate.outputs.gate-json }}'
          CHECKS=$(echo "$GATE_JSON" | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8');const p=JSON.parse(d);console.log((p.requiredChecks||[]).join(', '))" 2>/dev/null || echo "unknown")
          TOTAL=$(echo "$GATE_JSON" | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8');const p=JSON.parse(d);console.log(p.totalFiles||0)" 2>/dev/null || echo "0")
          COUNTS=$(echo "$GATE_JSON" | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8');const p=JSON.parse(d);const c=p.counts||{};console.log(Object.entries(c).map(([k,v])=>k+': '+v).join(', '))" 2>/dev/null || echo "")

          echo "## Risk Policy Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Risk Tier | \`${RISK_TIER}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Required Checks | ${CHECKS} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Changed Files | ${TOTAL} (${COUNTS}) |" >> "$GITHUB_STEP_SUMMARY"

  # ────────────────────────────────────────────────────────────
  # Job 2: PR Risk Comment
  # Posts or updates a risk classification comment on PRs.
  # ────────────────────────────────────────────────────────────
  pr-risk-comment:
    name: PR Risk Comment
    runs-on: ubuntu-latest
    needs: risk-policy-gate
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write

    steps:
      - name: Post risk classification comment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          RISK_TIER: ${{ needs.risk-policy-gate.outputs.risk-tier }}
          GATE_JSON: ${{ needs.risk-policy-gate.outputs.gate-json }}
        with:
          script: |
            const tier = process.env.RISK_TIER || 'unknown';
            let gateData = {};
            try { gateData = JSON.parse(process.env.GATE_JSON || '{}'); } catch {}

            const checks = (gateData.requiredChecks || []).map(c => `\`${c}\``).join(', ') || 'none';
            const total = gateData.totalFiles || 0;
            const counts = gateData.counts || {};
            const driftPass = gateData.docsDriftPass !== false;
            const tierEmoji = { high: '🔴', medium: '🟡', low: '🟢' }[tier] || '⚪';
            const reviewRequired = tier === 'high';

            const body = [
              `## ${tierEmoji} Risk Policy Gate: \`${tier}\``,
              '',
              '| Field | Value |',
              '|-------|-------|',
              `| Risk Tier | \`${tier}\` |`,
              `| Required Checks | ${checks} |`,
              `| Changed Files | ${total} (high: ${counts.high || 0}, medium: ${counts.medium || 0}, low: ${counts.low || 0}) |`,
              `| Docs Drift | ${driftPass ? '✅ Pass' : '❌ Drift detected'} |`,
              `| Code Review Required | ${reviewRequired ? '**Yes**' : 'No'} |`,
              '',
              `<!-- harness-risk-comment -->`,
            ].join('\n');

            // Update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '<!-- harness-risk-comment -->';
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ────────────────────────────────────────────────────────────
  # Job 3: Lint
  # ────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: risk-policy-gate
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore pnpm store cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  # ────────────────────────────────────────────────────────────
  # Job 3: Typecheck
  # ────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: risk-policy-gate
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore pnpm store cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

  # ────────────────────────────────────────────────────────────
  # Job 4: Test
  # ────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: risk-policy-gate
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore pnpm store cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Test with coverage
        run: |
          start=$(date +%s)
          pnpm test:coverage -- \
            --coverage.thresholds.statements 1 \
            --coverage.thresholds.branches 1 \
            --coverage.thresholds.functions 1 \
            --coverage.thresholds.lines 1
          echo "::notice:: Test run completed in $(($(date +%s) - start))s"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  # ────────────────────────────────────────────────────────────
  # Job 5: Browser Evidence (high-tier PRs only)
  # ────────────────────────────────────────────────────────────
  browser-evidence:
    name: Browser Evidence
    runs-on: ubuntu-latest
    needs: risk-policy-gate
    if: needs.risk-policy-gate.outputs.risk-tier == 'high'
    env:
      HOSTNAME: "0.0.0.0"
      PORT: "3001"
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore pnpm store cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start dev server
        run: |
          pnpm dev > /tmp/next-dev.log 2>&1 &
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Wait for server
        run: npx wait-on http://localhost:${{ env.PORT }} --timeout 180000

      - name: Capture browser evidence
        run: pnpm tsx scripts/harness/capture-browser-evidence.ts

      - name: Verify browser evidence
        run: pnpm tsx scripts/harness/verify-browser-evidence.ts

      - name: Upload evidence artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: browser-evidence
          path: harness-evidence/
          retention-days: 30

  # ────────────────────────────────────────────────────────────
  # Job 6: Build
  # Runs only after lint, typecheck, and test all pass.
  # ────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - test
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore pnpm store cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "1"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # ────────────────────────────────────────────────────────────
  # Job 7: Lighthouse CI
  # Runs against a local production server and fails on CWV/perf regressions.
  # ────────────────────────────────────────────────────────────
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - test
    permissions:
      contents: read
    env:
      HOSTNAME: "0.0.0.0"
      PORT: "3001"
      LHCI_BASE_URL: "http://127.0.0.1:3001"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore pnpm store cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production app for Lighthouse
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "1"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Start production server
        run: |
          pnpm start > /tmp/next-start.log 2>&1 &
          echo $! > /tmp/next-start.pid
        env:
          SKIP_ENV_VALIDATION: "1"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Wait for production server
        run: npx wait-on "${{ env.LHCI_BASE_URL }}" --timeout 180000

      - name: Resolve live candidate detail route
        id: kandidaat_route
        run: |
          DETAIL_PATH=$(node --input-type=module <<'EOF'
          const fallbackDetailPath = process.env.LHCI_CANDIDATE_DETAIL_PATH_FALLBACK?.trim() ?? "";
          const response = await fetch(`${process.env.LHCI_BASE_URL}/api/kandidaten?limit=1`, {
            headers: { accept: "application/json" },
          });
          if (!response.ok) {
            throw new Error(`Failed to load candidate index (${response.status})`);
          }

          const payload = await response.json();
          const candidateId = payload?.data?.[0]?.id;

          if (!candidateId) {
            console.warn(
              fallbackDetailPath
                ? `No candidate id available for Lighthouse detail route; falling back to ${fallbackDetailPath}`
                : "No candidate id available for Lighthouse detail route; skipping the detail route for this run",
            );
            console.log(fallbackDetailPath);
            process.exit(0);
          }

          console.log(`/kandidaten/${candidateId}`);
          EOF
          )

          echo "detail_path=${DETAIL_PATH}" >> "$GITHUB_OUTPUT"
          echo "Resolved Lighthouse candidate detail path: ${DETAIL_PATH}"
        env:
          LHCI_CANDIDATE_DETAIL_PATH_FALLBACK: ${{ vars.LHCI_CANDIDATE_DETAIL_PATH_FALLBACK }}

      - name: Run Lighthouse CI
        run: pnpm lighthouse:ci
        env:
          LHCI_CANDIDATE_DETAIL_PATH: ${{ steps.kandidaat_route.outputs.detail_path }}

      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: lighthouse-ci
          path: |
            .lighthouseci/
            /tmp/next-start.log
          if-no-files-found: ignore
          retention-days: 14

  # ────────────────────────────────────────────────────────────
  # Job 8: Symphony Gate
  # Single required status check for Symphony auto-merge.
  # Depends on all quality gates passing.
  # ────────────────────────────────────────────────────────────
  symphony-gate:
    name: Symphony Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - risk-policy-gate
      - lint
      - typecheck
      - test
      - build
      - lighthouse
    permissions:
      contents: read

    steps:
      - name: Check all gates passed
        run: |
          echo "Risk Policy Gate: ${{ needs.risk-policy-gate.result }}"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Typecheck: ${{ needs.typecheck.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Lighthouse CI: ${{ needs.lighthouse.result }}"

          if [[ "${{ needs.risk-policy-gate.result }}" != "success" ]] || \
             [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.typecheck.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.lighthouse.result }}" != "success" ]]; then
            echo "::error::One or more quality gates failed"
            exit 1
          fi
          echo "All quality gates passed — safe for Symphony auto-merge"
