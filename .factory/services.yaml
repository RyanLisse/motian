commands:
  install: pnpm install --frozen-lockfile
  typecheck: pnpm exec tsc --noEmit
  build: pnpm build
  test: pnpm test -- --maxWorkers=5
  test_app: pnpm test:app -- --maxWorkers=5
  lint: pnpm lint
  health: curl -sf http://localhost:3002/api/gezondheid
  benchmark_hybrid_search: pnpm benchmark:hybrid-search
  metrics_search_explain: pnpm metrics:search-explain
  metrics_search_path_latency: pnpm metrics:search-path-latency
  perf_budget_shell: pnpm perf:budget:shell

services:
  web:
    start: HOSTNAME=0.0.0.0 PORT=3002 pnpm dev
    stop: lsof -ti :3002 | xargs kill
    healthcheck: curl -sf http://localhost:3002/api/gezondheid
    port: 3002
    depends_on: []
